# Let the GameBridge go idle when nothing is actually listening.
#
# Install:  install -Dm644 tools/wireplumber/51-gamebridge.conf \
#             ~/.config/wireplumber/wireplumber.conf.d/51-gamebridge.conf
#           systemctl --user restart wireplumber
#
# WHY THIS EXISTS
#
# The driver registers an ALSA capture card, PipeWire adopts it on sight, and
# the isochronous stream is refcounted -- so for as long as PipeWire holds that
# capture open the endpoint stays at alt 1, the CX25840 keeps digitising, and
# 24 MB/s crosses the bus for nobody. The visible symptom is the front LED
# flashing forever.
#
# This is NOT a driver bug. The driver idles the endpoint the moment the last
# user goes away -- bAlternateSetting returns to 0 and "stream down" is logged.
# The problem is that there is always a user.
#
# WHY pause-on-idle IS THE KNOB
#
# WirePlumber already suspends idle nodes: scripts/node/suspend-node.lua adds a
# timeout when a node's state becomes "idle", defaulting to 5 seconds. That
# never fires here, because the node does not reach "idle" -- it sits in
# "running". session.suspend-timeout-seconds alone therefore changes nothing;
# it is set below only to be explicit about the delay.
#
# node.pause-on-idle is what makes the node actually stop when it has no links,
# which is what lets the suspend timeout apply at all.
#
# The card stays registered either way, so sound is still there the instant
# something asks for it. What changes is that nothing captures when no one is
# listening.
#
# Matched on the product string rather than the serial, so it survives a
# different unit. Both PIDs present the same ALSA name once firmware is loaded.

monitor.alsa.rules = [
  {
    matches = [
      {
        node.name = "~alsa_input.usb-Adaptec_Adaptec_GameBridge.*"
      }
    ]
    actions = {
      update-props = {
        node.pause-on-idle               = true
        session.suspend-timeout-seconds  = 5
      }
    }
  }
]
